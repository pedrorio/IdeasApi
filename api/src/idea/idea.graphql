type Idea {
    id: ID!

    created: Date!
    updated: Date!

    idea: String!
    description: String!

    author: User!

    score: Int!

    comments: [Comment!]
}

type IdeaPage {
    items: [Idea!]!
    nextCursor: String
}

type Query {
    ideas(cursor: String, limit: Int): IdeaPage!
    newestIdeas(cursor: String, limit: Int): IdeaPage!
    idea(id: ID!): Idea!
}

type Mutation {
    createIdea(data: IdeaInput!): Idea!
    updateIdea(id: ID!, data: IdeaInput!): Idea!
    deleteIdea(id: ID!): Idea!
}

input IdeaInput {
    idea: String!
    description: String!
}
