version: '3'
services:
  nginx:
    restart: always
    image: 'pedrorio/typegraph_nginx'
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - '4000:80'
    depends_on:
      - api
  api:
    restart: always
    image: 'pedrorio/typegraph_api'
    build:
      dockerfile: Dockerfile
      context: ./api
    environment:
      - WAIT_HOSTS=postgres:5432
      - SERVER_PORT
      - CLIENT_PORT
      - POSTGRES_PORT
      - SERVER_HOST
      - CLIENT_HOST
      - POSTGRES_HOST
      - CLIENT_PROTOCOL
      - SERVER_PROTOCOL
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - SESSION_SECRET
      - JWT_SECRET
    volumes:
      - /app/node_modules
      - ./api:/app
    depends_on:
      - postgres
  postgres:
    image: 'postgres:18'
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - '5432:5432'
    volumes:
      - postgres_database:/var/lib/postgresql/data


volumes:
  postgres_database:
